<!doctype html><html lang="nl"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShelterSync App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ink sidebar + paper canvas, white record surfaces, drawers for detail. Tokens mirror sheltersync.nl :root. */
:root{
  --paper:#F3F2F7; --card:#FFFFFF; --raise:#FFFFFF; --ink:#231F45; --muted:#4E4A6B; --muted2:#6E6A88;
  --acc:#F2B930; --accD:#8A5A00; --accTint:#FBF0D0; --accTint2:#FDF8EA; --onAcc:#231F45;
  --ok:#1E7A6E; --okD:#155C53; --okT:#DDF2EE;
  --away:#D9822B; --awayD:#8F4E0E; --awayT:#FBEBDB;
  --err:#A3261C; --errT:#FBE6E3;
  --line:#E2E0EA; --line2:#CDCAD9; --lineS:#ECEAF2; --track:#E7E5EE; --tHead:#F6F5F9; --selT:#EEECF8; --hover:#F7F6FB; --inpB:#C2BED3;
  --side:#231F45; --sideFg:#FFFFFF; --sideM:#BDB9D6; --sideLine:rgba(255,255,255,.09); --sideSel:rgba(255,255,255,.09);
  --scrim:rgba(23,20,47,.42);
  --sh1:0 1px 2px rgba(35,31,69,.05);
  --sh2:0 1px 2px rgba(35,31,69,.05),0 6px 16px -6px rgba(35,31,69,.12);
  --sh3:0 12px 40px -8px rgba(35,31,69,.28),0 2px 6px rgba(35,31,69,.08);
  --ring:0 0 0 3px rgba(242,185,48,.55);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-ctl:10px; --r-card:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13112A; --card:#1C1938; --raise:#24204A; --ink:#EEECF8; --muted:#C9C5E2; --muted2:#9E99BF;
  --accD:#F5C95E; --accTint:#3A3016; --accTint2:#2A2416;
  --ok:#5FC2B3; --okD:#86D6C9; --okT:#163733;
  --away:#F0A35A; --awayD:#F6BC85; --awayT:#3A2917;
  --err:#F08A7E; --errT:#3B1D1C;
  --line:#2F2B55; --line2:#423D70; --lineS:#28244B; --track:#2C2850; --tHead:#211E42; --selT:#2C2856; --hover:#24204A; --inpB:#4C4780;
  --side:#0E0C21; --sideM:#A29EC0;
  --scrim:rgba(0,0,0,.6); --sh1:none; --sh2:0 6px 16px -6px rgba(0,0,0,.5); --sh3:0 16px 40px -8px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#13112A; --card:#1C1938; --raise:#24204A; --ink:#EEECF8; --muted:#C9C5E2; --muted2:#9E99BF;
  --accD:#F5C95E; --accTint:#3A3016; --accTint2:#2A2416;
  --ok:#5FC2B3; --okD:#86D6C9; --okT:#163733;
  --away:#F0A35A; --awayD:#F6BC85; --awayT:#3A2917;
  --err:#F08A7E; --errT:#3B1D1C;
  --line:#2F2B55; --line2:#423D70; --lineS:#28244B; --track:#2C2850; --tHead:#211E42; --selT:#2C2856; --hover:#24204A; --inpB:#4C4780;
  --side:#0E0C21; --sideM:#A29EC0;
  --scrim:rgba(0,0,0,.6); --sh1:none; --sh2:0 6px 16px -6px rgba(0,0,0,.5); --sh3:0 16px 40px -8px rgba(0,0,0,.7);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:17px;font-weight:700;line-height:1.3}
h3{font-size:15px;font-weight:700;line-height:1.35}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--ring)!important;outline:none}
#view:focus-visible,.palette input:focus-visible,.inpwrap input:focus-visible{box-shadow:none!important}
.kv .pill{justify-self:start}
.note>span>.small,.note>div>.small{display:block}
.note .link{margin-top:4px}
.pop.calpop{max-height:none;overflow:visible}
.mono,.id{font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.id{color:var(--muted2);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .muted2{color:var(--muted2)}
.small{font-size:13px} .xs{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--sideFg);display:flex;flex-direction:column;gap:16px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--f-display);letter-spacing:-.02em;padding:6px 8px;color:var(--sideFg)}
.brand small{display:block;font:500 11.5px/1.2 var(--f-body);color:var(--sideM);letter-spacing:0;margin-top:3px}
.locbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px;width:100%;border:1px solid var(--sideLine);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;color:var(--sideFg)}
.locbtn:hover{background:rgba(255,255,255,.08)}
.locbtn .l{font-size:11px;color:var(--sideM);grid-column:1}
.locbtn .v{font-weight:600;grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locbtn .ic{grid-row:1/3;grid-column:2;color:var(--sideM)}
.navgrp{display:grid;gap:1px}
.navgrp .h{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sideM);opacity:.8;padding:8px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--sideM);font-weight:500;width:100%;position:relative;text-decoration:none}
.nav:hover{background:var(--sideSel);color:var(--sideFg)}
.nav[aria-current="page"]{background:var(--sideSel);color:var(--sideFg);font-weight:600}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav[aria-current="page"] .ic{color:var(--acc)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--acc);color:var(--onAcc);border-radius:999px;padding:0 7px;line-height:18px}
.nav .new{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--sideM);border:1px solid var(--sideLine);border-radius:5px;padding:0 5px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}
.side .foot{margin-top:auto;font-size:12px;color:var(--sideM);padding:0 10px;opacity:.8}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 28px}
.cmdk{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--tHead);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted2)}
.cmdk:hover{border-color:var(--line2)}
.cmdk span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted2);background:var(--card)}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn .dot{position:absolute;top:8px;right:9px;min-width:8px;height:8px;border-radius:50%;background:var(--away);box-shadow:0 0 0 2px var(--card)}
.userbtn{display:flex;align-items:center;gap:10px;text-align:right;line-height:1.25;padding:4px 6px 4px 10px;border-radius:12px}
.userbtn:hover{background:var(--hover)}
.userbtn b{display:block;font-size:13px} .userbtn span.r{font-size:11.5px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--selT);color:var(--ink);display:grid;place-items:center;font:700 12px var(--f-body);flex:none}
.av.lg{width:52px;height:52px;font-size:16px}
.burger{display:none}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--okD);padding:5px 10px;border-radius:999px;background:var(--okT)}
.syncpill.off{color:var(--accD);background:var(--accTint)}
.syncpill i{width:7px;height:7px;border-radius:50%;background:currentColor}

.rolebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 28px;background:var(--card);border-bottom:1px solid var(--line);font-size:12.5px}
.content{padding:24px 28px 56px;display:grid;gap:20px;min-width:0;max-width:1440px;width:100%}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--tHead);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:5px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh2)}
.seg .c{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--line);color:var(--muted);line-height:17px}
.seg button[aria-selected="true"] .c,.seg button[aria-pressed="true"] .c{background:var(--ink);color:var(--card)}
.seg.lg button{padding:8px 14px;font-size:13.5px}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

/* page head */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.phead .t{display:grid;gap:6px;max-width:72ch;min-width:0}
.crumbs{font-size:13px;color:var(--muted2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{color:var(--muted);font-weight:500}.crumbs button:hover{color:var(--ink);text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s;box-shadow:var(--sh1)}
.btn:hover{background:var(--hover);border-color:var(--inpB)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc);box-shadow:0 1px 0 rgba(138,90,0,.25),var(--sh1)}
.btn.pri:hover{background:#E8AE24}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.dark:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.danger:hover{background:var(--errT)}
.btn.dangerfill{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.big{height:54px;font-size:16px;border-radius:14px;width:100%;white-space:normal}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn .ic{width:16px;height:16px}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration-color:var(--ink)}

/* fields */
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted2)}
.field .err{font-size:12px;color:var(--err);font-weight:600}
.inp{height:42px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:0 12px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:hover{border-color:var(--muted2)}
.inp:focus{border-color:var(--ink);box-shadow:var(--ring)}
.inp.bad{border-color:var(--err)}
.req{color:var(--err)}
.inpwrap{display:flex;align-items:center;gap:8px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:0 12px;height:42px}
.inpwrap:focus-within{border-color:var(--ink);box-shadow:var(--ring)}
.inpwrap input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.inpwrap.sm{height:36px}

/* custom select trigger */
.sel{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:6px 10px 6px 12px;text-align:left;transition:border-color .12s,box-shadow .12s}
.sel:hover{border-color:var(--muted2)}
.sel[aria-expanded="true"]{border-color:var(--ink);box-shadow:var(--ring)}
.sel .sv{flex:1;min-width:0;display:grid;line-height:1.3}
.sel .sv b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .sv small{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .ph{color:var(--muted2);font-weight:400}
.sel .chev{color:var(--muted2);transition:transform .15s}
.sel[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sel.sm{min-height:34px;padding:3px 8px 3px 10px;border-radius:9px}
.sel .lead{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tHead);flex:none}

/* popover / listbox */
.pop{position:fixed;z-index:40;background:var(--raise);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh3);padding:6px;min-width:220px;max-width:min(420px,calc(100vw - 24px));max-height:min(420px,70vh);overflow:auto;animation:popin .12s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .psearch{position:sticky;top:-6px;background:var(--raise);padding:4px 2px 6px;margin:-2px 0 4px;border-bottom:1px solid var(--lineS)}
.pop .grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:8px 10px 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.opt[aria-selected="true"]{background:var(--selT)}
.opt.act,.opt:hover{background:var(--hover)}
.opt[aria-selected="true"].act{background:var(--selT)}
.opt .ot{flex:1;min-width:0;display:grid;line-height:1.3}
.opt .ot b{font-weight:600}
.opt .ot small{font-size:12px;color:var(--muted2)}
.opt .om{font-size:12px;color:var(--muted);white-space:nowrap}
.opt .ck{width:16px;color:var(--ink);visibility:hidden}
.opt[aria-selected="true"] .ck{visibility:visible}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt .lead{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tHead);flex:none}
.opt.danger{color:var(--err)}
.pop .sep{height:1px;background:var(--lineS);margin:4px 0}
.pop .none{padding:16px;text-align:center;color:var(--muted2);font-size:13px}

/* checkbox / radio / switch */
.cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--inpB);background:var(--card);display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s;color:var(--card)}
.cbox .ic{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.6);transition:all .12s}
[aria-checked="true"]>.cbox,[aria-checked="true"] .cbox{background:var(--ink);border-color:var(--ink)}
[aria-checked="true"]>.cbox .ic,[aria-checked="true"] .cbox .ic{opacity:1;transform:none}
.rdot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--inpB);background:var(--card);flex:none;display:grid;place-items:center}
.rdot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .12s}
[aria-checked="true"] .rdot{border-color:var(--ink)}
[aria-checked="true"] .rdot::after{transform:scale(1)}
.ccard{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;transition:border-color .12s,background .12s,box-shadow .12s}
.ccard:hover{border-color:var(--line2);background:var(--hover)}
.ccard[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.ccard .ct{flex:1;min-width:0;display:grid;gap:1px}
.ccard .ct b{font-weight:600}
.ccard .ct small{font-size:12.5px;color:var(--muted)}
.ccard .cm{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ccard[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.sw{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
[aria-checked="true"] .sw{background:var(--ok)}
[aria-checked="true"] .sw::after{transform:translateX(16px)}
.swrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--inpB);border-radius:var(--r-ctl);overflow:hidden;height:42px;background:var(--card)}
.stepper button{width:40px;height:100%;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--hover);color:var(--ink)}
.stepper b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}

/* calendar */
.cal{padding:6px;width:288px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .gr span{font-size:11px;color:var(--muted2);font-weight:600;padding:4px 0}
.cal .d{height:34px;border-radius:9px;font-size:13px;font-variant-numeric:tabular-nums}
.cal .d:hover{background:var(--hover)}
.cal .d.today{box-shadow:inset 0 0 0 1px var(--line2)}
.cal .d.sel{background:var(--ink);color:var(--card);font-weight:700}
.cal .d.out{color:var(--muted2);opacity:.5}
.cal .times{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--lineS)}
.cal .times button{padding:4px 8px;border-radius:7px;font-size:12.5px;border:1px solid var(--line)}
.cal .times button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;min-width:0;box-shadow:var(--sh1)}
.card.flush{padding:0;overflow:hidden}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card.flush>.ch{padding:16px 20px;margin:0;border-bottom:1px solid var(--lineS)}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh1);transition:border-color .12s,box-shadow .12s,transform .12s;position:relative}
.tile:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.tile[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--sh2)}
.tile .go{position:absolute;right:14px;bottom:14px;color:var(--muted2);transition:transform .12s}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* KPI */
.kpi{display:grid;gap:8px;align-content:start}
.kpi .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font:800 32px/1 var(--f-display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}

.delta{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--tHead);color:var(--muted)}
.delta.up{background:var(--okT);color:var(--okD)} .delta.dn{background:var(--errT);color:var(--err)}
.meter{height:8px;border-radius:999px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:999px}
.meter i.ok{background:var(--ok)} .meter i.away{background:var(--away)} .meter i.warn{background:var(--acc)} .meter i.err{background:var(--err)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.nodot::before{display:none}
.p-ok{background:var(--okT);color:var(--okD)}
.p-away{background:var(--awayT);color:var(--awayD)}
.p-warn{background:var(--accTint);color:var(--accD)}
.p-err{background:var(--errT);color:var(--err)}
.p-n{background:var(--tHead);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-ink{background:var(--ink);color:var(--card)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--tHead);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--tHead);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}

.person{display:flex;align-items:center;gap:10px;min-width:0}

.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--lineS)}

/* notices */
.note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--tHead);font-size:13.5px;align-items:flex-start;box-shadow:inset 0 0 0 1px var(--line)}
.note>.ic{margin-top:2px;color:var(--muted)}
.note.warn{background:var(--accTint2);box-shadow:inset 0 0 0 1px var(--accTint)}.note.warn>.ic{color:var(--accD)}
.note.err{background:var(--errT);box-shadow:none}.note.err>.ic{color:var(--err)}
.note.ok{background:var(--okT);box-shadow:none}.note.ok>.ic{color:var(--okD)}
.note b{display:block}

.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted2)}

/* timeline */
.tl{display:grid;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:9px;top:16px;bottom:0;width:2px;background:var(--lineS)}
.tl li:last-child{padding-bottom:0}

.tl .d{width:12px;height:12px;border-radius:50%;margin:4px 0 0 4px;background:var(--card);border:2px solid var(--muted2)}
.tl .d.ok{border-color:var(--ok);background:var(--ok)} .tl .d.away{border-color:var(--away);background:var(--away)} .tl .d.warn{border-color:var(--acc);background:var(--acc)} .tl .d.err{border-color:var(--err);background:var(--err)} .tl .d.ink{border-color:var(--ink);background:var(--ink)}

/* beds */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bed{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);display:grid;gap:3px;min-height:62px;text-align:left;position:relative;overflow:hidden;transition:border-color .12s,box-shadow .12s}

function openDate(anchor){

    <div class="row between" style="margin-top:8px"><button type="button" class="btn ghost sm" data-day="${today}">Vandaag</button>${tpath?`<button type="button" class="btn dark sm" data-done>Klaar</button>`:""}</div></div>`;
  };

  const rebind=()=>{ const n=$(`[data-fid="date:${path}"]`); if(n){ anchor=n; POP.anchor=n; n.setAttribute("aria-expanded","true"); placePop(el,n); } };
  el.addEventListener("click",e=>{

    const acts=[["Nieuwe inschrijving","plus",()=>go("intake"),["intake","locatie"]],["Nieuwe melding","flag",()=>{go("meldingen");openLayer("modal","ticket");},["locatie","beveiliging"]],["Nachtmodus aan/uit","moon",toggleTheme,["*"]]].filter(a=>(a[3].includes("*")||a[3].includes(S.role))&&(!q||a[0].toLowerCase().includes(q))).map(a=>({g:"Acties",t:a[0],i:a[1],a:a[2]}));
    items=[...people,...melds,...acts,...pages].slice(0,14);
    let g=null; res.innerHTML=items.length?items.map((x,i)=>(x.g!==g?`<div class="grp" style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:8px 10px 4px">${g=x.g}</div>`:"")+`<button type="button" class="opt ${i===0?"act":""}" data-pi="${i}" role="option"><span class="lead">${ic(x.i,"s")}</span><span class="ot"><b>${esc(x.t)}</b>${x.d?`<small>${esc(x.d)}</small>`:""}</span>${ic("chevr","s muted2")}</button>`).join(""):`<div class="none">Geen resultaten voor “${esc(inp.value)}”. Zoek op naam, bewonernummer (HP-0412) of meldingnummer (M-1042).</div>`;
  };
  const close=()=>{ wrap.remove(); POP=null; };
  const run=i=>{ const x=items[i]; if(!x) return; close(); x.a(); };
  POP={el:wrap,anchor:$("#cmdk"),onKey:e=>{
    const opts=$$(".opt",res); let i=opts.findIndex(o=>o.classList.contains("act"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); opts[i]?.classList.remove("act"); i=(i+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length; opts[i]?.classList.add("act"); opts[i]?.scrollIntoView({block:"nearest"}); }
    if(e.key==="Enter"){ e.preventDefault(); run(+opts[i]?.dataset.pi); }
  }};
  inp.addEventListener("input",draw); res.addEventListener("click",e=>{const b=e.target.closest("[data-pi]"); if(b) run(+b.dataset.pi);});
  wrap.querySelector("[data-pclose]").addEventListener("click",close);
  draw(); inp.focus();
}

/* =========================================================

function openLayer(type,name,arg){ closePop(false); S.layer={type,name,arg,ret:document.activeElement}; render(); }
function closeLayer(){ const r=S.layer?.ret; S.layer=null; render(); if(r&&document.body.contains(r)) r.focus(); }
function renderLayer(){
  const L=S.layer; const host=$("#layer");
  if(!L){ host.innerHTML=""; return; }
  const c=LAYERS[L.name](L.arg); if(!c){ S.layer=null; host.innerHTML=""; return; }

  host.innerHTML = `<div class="scrim" data-closelayer></div>` + (L.type==="drawer"
    ? `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="lyT"><div class="dh"><div style="min-width:0">${c.eyebrow?`<div class="eyebrow" style="margin-bottom:4px">${c.eyebrow}</div>`:""}<h2 id="lyT">${c.title}</h2>${c.sub?`<p class="small muted" style="margin-top:2px">${c.sub}</p>`:""}</div>${x}</div><div class="db">${c.body}</div>${c.foot?`<div class="df">${c.foot}</div>`:""}</aside>`

}

/* =========================================================
   TOAST (with optional undo)
   ========================================================= */
function toast(msg,undo){
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status");
  el.innerHTML=ic("check")+`<span>${msg}</span>`+(undo?`<button type="button">Ongedaan maken</button>`:"");
  if(undo) el.querySelector("button").onclick=()=>{ undo(); el.remove(); render(); toast("Ongedaan gemaakt"); };
  $("#toasts").appendChild(el); setTimeout(()=>el.remove(), undo?6000:3200);
}
const isDark=()=>{ const r=document.documentElement; return r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches); };

function matchRooms(){

    return {r,free,occ,fits:free.length>=I.hh && (I.hh===1||occ===0||I.wing==="A")};
  }).filter(x=>x.free.length).sort((a,b)=>b.fits-a.fits||a.occ-b.occ);
}

      <div class="field"><span class="lbl">Prioriteit</span>${Seg(`meldsel.${m.id}.prio`,[["hoog","Hoog"],["normaal","Normaal"],["laag","Laag"]],{label:"Prioriteit",cls:"full"})}</div></div>`:""}
    <div><div class="eyebrow" style="margin-bottom:10px">Verloop</div><ul class="tl">${m.tl.map(x=>`<li><span class="d ${x.k}"></span><div><b>${esc(x.t)}</b><div class="xs muted2">${x.w}</div></div></li>`).join("")}</ul></div>

V.import = () => {

  let body="";
  if(P.step===1) body=`<div class="card"><label class="empty dropzone" for="file" style="padding:56px 16px;cursor:pointer" id="drop">${ic("upload")}<b>Sleep een Excel- of CSV-bestand hierheen</b><span class="small">of klik om een bestand te kiezen · .xlsx, .xls of .csv · maximaal 10 MB</span><input id="file" type="file" accept=".xlsx,.xls,.csv" class="sr"></label>
    <div class="row between" style="margin-top:14px"><span class="small muted">Geen bestand bij de hand?</span><button class="btn sm" data-act="impSample">Gebruik voorbeeldbestand</button></div></div>`;
  if(P.step===2) body=`<div class="card flush"><div class="ch"><div><h2>Kolommen koppelen</h2><p class="small muted">Blad ‘Bewoners’ · 142 rijen · we hebben de kolommen alvast gekoppeld</p></div><span class="pill ${okReq===4?"p-ok":"p-warn"}">${okReq} van 4 verplichte velden</span></div>
    <div class="tw"><table><thead><tr><th>Kolom in Excel</th><th>Voorbeeld uit rij 2</th><th style="min-width:240px">Wordt in ShelterSync</th><th>Controle</th></tr></thead><tbody>
    ${IMPCOLS.map(([c,ex])=>{const locked=c==="BSN"||c==="Medisch";const v=P.map[c];const f=FIELDS.find(x=>x.v===v);const dup=v!=="skip"&&Object.entries(P.map).some(([k,x])=>k!==c&&x===v);
      return `<tr><td class="mono" style="color:var(--ink)">${c}</td><td class="small">${locked?`<span class="muted2">verborgen</span>`:ex}</td><td>${locked?`<span class="tag">${ic("lock","s")}Altijd overgeslagen</span>`:Sel(`imp.map.${c}`,FIELDS.map(x=>({...x,dis:x.v!=="skip"&&x.v!==v&&Object.values(P.map).includes(x.v),m:x.v!=="skip"&&x.v!==v&&Object.values(P.map).includes(x.v)?"al gekoppeld":""})),{sm:1,label:`Koppeling voor ${c}`})}</td>
      <td>${locked?`<span class="small muted">${c==="BSN"?"ShelterSync slaat geen BSN op":"Medische info hoort bij de GGD"}</span>`:dup?`<span class="pill p-err">Dubbel gekoppeld</span>`:v==="skip"?`<span class="pill p-n">Wordt niet ingelezen</span>`:c==="Telefoon"?`<span class="pill p-warn">2 rijen onleesbaar</span>`:`<span class="pill p-ok">${f.t} herkend</span>`}</td></tr>`}).join("")}
    </tbody></table></div>
    <div class="tfoot"><button class="btn sm" data-impstep="1">${ic("back")}Ander bestand</button><div class="row">${okReq<4?`<span class="small" style="color:var(--err)">Koppel ${req.filter(r=>!mapped.includes(r)).map(r=>FIELDS.find(f=>f.v===r).t.toLowerCase()).join(", ")}</span>`:""}<button class="btn pri sm" data-impstep="3" ${okReq<4?"disabled":""}>Naar controleren ${ic("arrow")}</button></div></div></div>`;
  if(P.step===3){ const done=Object.keys(P.fixed).length;
    body=`<div class="split"><div class="card flush"><div class="ch"><div><h2>4 rijen vragen een keuze</h2><p class="small muted">De andere 138 rijen zijn in orde</p></div><span class="pill ${done===4?"p-ok":"p-warn"}">${done} van 4 opgelost</span></div>

    <div class="card stack"><h2>Wat er gaat gebeuren</h2>${[["Nieuw ingelezen",138+(P.fixed["131"]==="gen"?1:0)+(P.fixed["42"]&&P.fixed["42"]!=="skip"?1:0)+(P.fixed["17"]==="empty"?1:0),"ok"],["Bijgewerkt",P.fixed["88"]==="update"?1:0,"n"],["Overgeslagen",Object.values(P.fixed).filter(v=>v==="skip").length,"n"],["Niet geïmporteerde kolommen","BSN, Medisch","n"]].map(([a,b,c])=>`<div class="row between"><span>${a}</span><span class="pill p-${c} nodot num">${b}</span></div>`).join("")}<div class="note">${ic("undo")}<span class="small">Je kunt de import tot 24 uur na inlezen in zijn geheel terugdraaien.</span></div></div></div>`; }

  const SC=S.scan; const who = SC.pick?R(SC.pick): SC.state==="flag"?R("HP-0433"):R("HP-0440");
  let screen="";
  if(SC.tab==="scan"){
    screen=`<div class="scanner"><span class="fr"></span><span class="ln"></span><span style="position:absolute;bottom:14px">Houd de QR-code in het kader</span></div>`+

    :`<div class="card stack" style="gap:12px"><div class="row between"><span class="xs muted num">${SC.pick?"Handmatig gezocht":"Gescand "+now()}</span>${who.st==="afwezig"?`<span class="pill p-warn">Let op</span>`:who.st==="verlof"?`<span class="pill p-away">Terug van verlof</span>`:`<span class="pill p-ok">Mag naar binnen</span>`}</div>
      <div class="person"><span class="av lg">${ini(who.n)}</span><div><b style="font-size:18px">${who.n}</b><span class="id">${who.id} · ${who.beds[0]?.slice(0,5)||"—"}</span></div></div>
      ${who.st==="afwezig"?`<div class="note warn">${ic("info")}<span class="small"><b>Vannacht niet aanwezig geweest.</b> Laat binnen en meld het: de locatiemanager krijgt automatisch bericht.</span></div>`:""}

  } else if(SC.tab==="zoek"){

    screen=`<div class="inpwrap">${ic("search","s")}<input id="scq" data-bind-live="scan.q" placeholder="Naam, nummer of kamer" value="${esc(SC.q)}" aria-label="Bewoner zoeken"></div>
      <div class="card flush">${list.length?list.slice(0,6).map(r=>`<button type="button" class="opt" style="border-radius:0;border-bottom:1px solid var(--lineS);padding:12px 14px" data-pick="${r.id}"><span class="av">${ini(r.n)}</span><span class="ot"><b>${r.n}</b><small>${r.id} · ${r.beds[0].slice(0,5)}</small></span>${pill(r.st)}</button>`).join(""):`<div style="padding:16px">${empty("search","Niemand gevonden","Controleer de spelling of bel de locatiemanager.")}</div>`}</div>`;
  } else {
    screen=`<div class="card flush">${GATE.slice(0,7).map(g=>{const r=R(g.id);return `<div class="row" style="padding:10px 14px;border-bottom:1px solid var(--lineS);flex-wrap:nowrap"><span class="num small" style="width:42px">${g.t}</span><span style="flex:1;min-width:0"><b class="small">${r.n}</b><div class="xs muted2">${g.how}${g.queued?" · in wachtrij":""}</div></span>${g.ev==="in"?`<span class="pill p-ok">In</span>`:`<span class="pill p-away">Uit</span>`}</div>`}).join("")}</div>`;
  }
  return head("","Poortscanner","Zo ziet de beveiliger het op de telefoon. Met de knoppen rechts kies je wat de scanner leest.",
    `<div class="stack tight" style="justify-items:end"><span class="xs muted2">Demo: wat leest de scanner?</span><div class="row">${Seg("scan.state",[["ok","Geldige badge"],["flag","Badge met ‘let op’"],["unknown","Onbekende badge"]],{label:"Demo scanstand"})}<button type="button" class="btn sm" role="switch" aria-checked="${S.offline}" data-act="offline">${ic(S.offline?"wifioff":"wifi")}${S.offline?"Offline":"Online"}</button></div></div>`)+
  `<div class="split even" style="align-items:start"><div class="phone" aria-label="Voorbeeld telefoonscherm">
    <div class="ph-top"><div><b style="font-family:var(--f-display);font-size:16px">Poort 1</b><div class="xs muted">Havenpark · Ruben de Wit</div></div>${S.offline?`<span class="pill p-warn">Offline · ${S.queue} wacht</span>`:`<span class="pill p-ok">Online</span>`}</div>
    <div class="body">${screen}</div>
    <div class="tabbar" role="tablist">${[["scan","scan","Scannen"],["zoek","search","Zoeken"],["log","log","Laatste scans"]].map(([k,i,t])=>`<button type="button" role="tab" aria-selected="${SC.tab===k}" data-scantab="${k}">${ic(i)}${t}</button>`).join("")}</div>
  </div>
  <div class="stack"><div class="card"><h2 style="margin-bottom:12px">Wat de beveiliger wel en niet ziet</h2>
    <div class="grid g2" style="gap:12px"><div><div class="eyebrow" style="color:var(--ok)">Wel</div><ul class="small" style="padding-left:18px;margin:6px 0 0;display:grid;gap:4px"><li>Naam, bewonernummer, kamer</li><li>Mag naar binnen of niet</li><li>Eén instructie als er iets speelt</li></ul></div>
    <div><div class="eyebrow" style="color:var(--err)">Niet</div><ul class="small" style="padding-left:18px;margin:6px 0 0;display:grid;gap:4px"><li>Foto (tenzij de locatie dit aanzet)</li><li>Medische of zorginformatie</li><li>Begeleidingsnotities</li></ul></div></div></div>
    <div class="note">${ic("wifi")}<div><b>Werkt ook zonder verbinding</b><span class="small">Scans blijven op het toestel en gaan mee zodra er weer verbinding is. Na 30 minuten offline krijgt de locatiemanager een bericht. Zet de demo op ‘Offline’ om het te proberen.</span></div></div>
  </div></div>`;
};

/* ---------- Regie ---------- */
V.regie = () => {
  const cap=LOCS.reduce((a,l)=>a+l.cap,0), occ=LOCS.reduce((a,l)=>a+l.occ,0), pres=LOCS.reduce((a,l)=>a+l.pres,0);
  const g=[0,1,2].map(i=>LOCS.reduce((a,l)=>a+l.grp[i],0));
  const fr=k=>LOCS.reduce((a,l)=>a+l.free[k],0);
  const openE=ESC.filter(e=>e.status==="open");
  return head(`<span>Gemeente Rivierstad</span>`,"Regieoverzicht","Cijfers per locatie, bijgewerkt bij elke synchronisatie. Geen namen of dossiers van bewoners.",
    `<button class="btn" data-go="rapportages">${ic("chart")}Rapportages</button><button class="btn pri" data-layer="modal:export:week">${ic("download")}Weekstaat</button>`)+
  `<div class="grid g4">
    <div class="card kpi"><span class="eyebrow">Capaciteit</span><div class="v">${nf(cap)}<small>bedden</small></div><div class="meter"><i style="width:${occ/cap*100}%"></i></div><span class="small muted num">${nf(occ)} bezet (${pct(occ,cap)}%) · ${cap-occ} vrij</span></div>
    <div class="card kpi"><span class="eyebrow">Aanwezig vannacht</span><div class="v">${nf(pres)}</div><span class="small muted num">${pct(pres,occ)}% van de bewoners</span></div>
    <div class="card kpi"><span class="eyebrow">Doelgroepen</span><div class="v">${nf(occ)}<small>bewoners</small></div><div class="meter"><i style="width:${g[0]/occ*100}%"></i><i class="ok" style="width:${g[1]/occ*100}%"></i><i class="warn" style="width:${g[2]/occ*100}%"></i></div><span class="small muted num">${g[0]} alleenstaand · ${g[1]} in gezinnen · ${g[2]} zorg</span></div>
    <button class="tile kpi" data-go="escalaties"><div class="top2"><span class="eyebrow">Escalaties open</span>${openE.some(e=>e.prio==="hoog")?`<span class="pill p-err">1 hoog</span>`:""}</div><div class="v">${openE.length}</div><span class="small muted">Eerstvolgende besluit ${openE[0]?.due||"—"}</span>${ic("arrow","go s")}</button>
  </div>
  <div class="card flush"><div class="ch"><h2>Locaties</h2><span class="small muted">Klik op een locatie voor details en contact</span></div>
  <div class="tw"><table><thead><tr><th>Locatie</th><th class="hide-s">Type</th><th class="r">Bezet</th><th style="width:22%">Bezetting</th><th class="r hide-s">Aanwezig</th><th>Status</th><th></th></tr></thead><tbody>
  ${LOCS.map(l=>{const p=l.occ/l.cap;const e=ESC.filter(x=>x.status==="open"&&x.loc===l.name).length;return `<tr class="click" data-loc="${l.code}"><td><b>${l.name}</b><div class="xs muted2"><span class="mono">${l.code}</span> · ${l.sync} min geleden</div></td><td class="small hide-s">${l.type}</td><td class="r num">${l.occ} / ${l.cap}</td><td><div class="meter"><i class="${p>.95?"warn":""}" style="width:${p*100}%"></i></div><span class="xs muted num">${pct(l.occ,l.cap)}%</span></td><td class="r num hide-s">${pct(l.pres,l.occ)}%</td><td>${e?`<span class="pill p-warn">${e} escalatie</span>`:p>.95?`<span class="pill p-warn">Bijna vol</span>`:`<span class="pill p-ok">Normaal</span>`}</td><td class="go">${ic("chevr","s")}</td></tr>`}).join("")}
  <tr style="background:var(--tHead)"><td><b>Totaal</b></td><td class="hide-s"></td><td class="r num"><b>${nf(occ)} / ${nf(cap)}</b></td><td><span class="xs muted num">${pct(occ,cap)}%</span></td><td class="r num hide-s"><b>${pct(pres,occ)}%</b></td><td></td><td></td></tr>
  </tbody></table></div></div>
  <div class="grid g2"><div class="card"><div class="ch"><h2>Direct beschikbaar</h2><span class="pill p-ok">${cap-occ} vrij</span></div>
    ${[["Gezinsplekken","gezin"],["Alleenstaanden","alleen"],["Zorgplekken","zorg"]].map(([a,k])=>`<div class="row between" style="padding:10px 0;border-top:1px solid var(--lineS);flex-wrap:nowrap"><div style="min-width:0"><b>${a}</b><div class="row" style="gap:6px;margin-top:4px">${LOCS.filter(l=>l.free[k]).map(l=>`<button class="tag" data-loc="${l.code}" style="cursor:pointer">${l.name} · ${l.free[k]}</button>`).join("")}</div></div><b class="num" style="font:800 24px var(--f-display)">${fr(k)}</b></div>`).join("")}
  </div>
  <div class="card"><div class="ch"><h2>Wat je hier wel en niet ziet</h2><span class="lock">${ic("shield","s")}Rol: gemeente</span></div>
    <ul class="small" style="padding-left:18px;margin:0;display:grid;gap:8px"><li>Aantallen per locatie, geen namen.</li><li>Groepen kleiner dan 5 tonen we als ‘&lt;5’.</li><li>Bij escalaties alleen wat nodig is voor het besluit: behoefte, samenstelling, termijn.</li><li>Elke weergave staat in het <button class="link" data-go="audit">auditlog</button>.</li></ul></div></div>`;
};

/* ---------- Escalaties ---------- */
V.escalaties = () => {
  const E=S.esc; const list=ESC.filter(e=>e.status===E.tab);
  if(!list.find(e=>e.id===E.sel)) E.sel=list[0]?.id||null;
  const e=ESC.find(x=>x.id===E.sel);
  const detail=!e?`<div class="card">${empty("check","Geen escalaties","Als een locatie iets niet zelf kan oplossen, verschijnt het hier.")}</div>`:
  `<div class="card stack sticky" style="gap:18px"><div class="row between"><span class="id">${e.id}</span><span class="pill ${e.prio==="hoog"?"p-err":"p-warn"}">${e.prio==="hoog"?"Hoog":"Normaal"}${e.status==="open"?` · besluit vóór ${e.due}`:""}</span></div>
    <h2 style="font-size:20px;margin-top:-8px">${e.t}</h2>
    <div class="kv"><div><span class="eyebrow">Van</span><button class="link" data-loc="${LOCS.find(l=>l.name===e.loc).code}">${e.loc}</button></div><div><span class="eyebrow">Wie</span><span>${e.hh}</span></div><div><span class="eyebrow">Behoefte</span><span>${e.need}</span></div></div>
    <div class="note">${ic("lock")}<span class="small">Medische details blijven bij de GGD en de locatie. Je ziet alleen de categorie.</span></div>
    ${e.status==="open"?`<div><div class="eyebrow" style="margin-bottom:8px">Kies een plek</div><div class="stack tight" role="radiogroup" aria-label="Plek">${e.options.map(([v,t,d])=>Radio(`esc.choice.${e.id}`,v,t,d)).join("")}</div></div>`
    :`<div class="note ok">${ic("check")}<div><b>Besloten</b><span class="small">${e.decision}</span></div></div>`}
    <div><div class="eyebrow" style="margin-bottom:10px">Verloop</div><ul class="tl">${e.tl.map(x=>`<li><span class="d ${x.k}"></span><div><b>${esc(x.t)}</b><div class="xs muted2">${x.w}</div></div></li>`).join("")}</ul></div>
    ${e.status==="open"?`<div class="row between" style="border-top:1px solid var(--lineS);padding-top:14px"><button class="btn" data-layer="modal:ask:${e.id}">${ic("send")}Vraag stellen aan locatie</button><button class="btn pri" data-act="escDecide">${ic("check")}${e.options.find(o=>o[0]===E.choice[e.id])?.[1]||"Plek"} toewijzen</button></div>`:""}
  </div>`;
  return head(`<span>Gemeente Rivierstad</span>`,"Escalaties","Knelpunten die een locatie niet zelf kan oplossen. Norm: binnen 4 uur een besluit.")+
  Seg("esc.tab",[["open","Open",ESC.filter(x=>x.status==="open").length],["besloten","Besloten",ESC.filter(x=>x.status==="besloten").length]],{tabs:1,cls:"lg",label:"Status"})+
  `<div class="split list"><div class="stack tight">${list.length?list.map(x=>`<button type="button" class="tile" data-esel="${x.id}" aria-current="${x.id===E.sel}"><div class="row between"><span class="id">${x.id}</span><span class="pill ${x.prio==="hoog"?"p-err":"p-warn"}">${x.prio==="hoog"?"Hoog":"Normaal"}</span></div><h3 style="margin:8px 0 4px;padding-right:24px">${x.t}</h3><div class="small muted">${x.loc} · ${x.hh} · ${x.when}</div>${ic("chevr","go s")}</button>`).join(""):empty("check","Niets open","Alle escalaties zijn besloten.")}</div>${detail}</div>`;
};

/* ---------- Rapportages ---------- */
V.rapportages = () => {
  const n=S.rap.range; const base=[1290,1302,1296,1310,1305,1318,1312,1320,1316,1324,1319,1330,1326,1318,1325,1331,1322,1340,1349,1338,1344,1352,1357,1350,1362,1362];
  const wk=base.slice(-n).map((v,i)=>[40-n+1+i,v]);
  const W=680,H=230,pl=48,pr=16,pt=16,pb=28,lo=1200,hi=1500; const x=i=>pl+i*(W-pl-pr)/(wk.length-1), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const line=wk.map((w,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(w[1]).toFixed(1)}`).join("");
  const step=n>12?4:n>4?2:1; const last=wk[wk.length-1], first=wk[0];
  return head(`<span>Gemeente Rivierstad</span>`,"Rapportages","Alle exports zijn geaggregeerd. Groepen kleiner dan 5 worden onderdrukt.",Seg("rap.range",[[4,"4 weken"],[12,"12 weken"],[26,"Half jaar"]],{label:"Periode"}))+
  `<div class="card"><div class="ch"><div><h2>Bezetting, laatste ${n===26?"26":n} weken</h2><p class="small muted" id="rapRead">Gemiddelde nachtbezetting alle locaties: van ${nf(first[1])} (wk ${first[0]}) naar ${nf(last[1])} (wk ${last[0]})</p></div><div class="legend"><span><i style="background:var(--ink)"></i>Bezet</span><span><i style="background:var(--err)"></i>Capaciteit 1.480</span></div></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bezetting van ${first[1]} naar ${last[1]}">
    ${[1200,1300,1400,1500].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--lineS)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`).join("")}
    <line x1="${pl}" x2="${W-pr}" y1="${y(1480)}" y2="${y(1480)}" stroke="var(--err)" stroke-dasharray="4 4"/>
    <path d="${line}L${x(wk.length-1)},${y(lo)}L${x(0)},${y(lo)}Z" fill="var(--selT)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
    ${wk.map((w,i)=>`<g class="col" data-wk="${i}"><rect x="${x(i)-(W-pl-pr)/(wk.length-1)/2}" y="${pt}" width="${(W-pl-pr)/(wk.length-1)}" height="${H-pt-pb}" fill="transparent"/><circle cx="${x(i)}" cy="${y(w[1])}" r="${i===wk.length-1?5:3}" fill="${i===wk.length-1?"var(--acc)":"var(--card)"}" stroke="var(--ink)" stroke-width="1.5"/>${i%step===0||i===wk.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">wk ${w[0]}</text>`:""}</g>`).join("")}
    <text x="${x(wk.length-1)-10}" y="${y(last[1])-12}" text-anchor="end" style="fill:var(--ink);font-weight:700">${nf(last[1])}</text>
  </svg></div></div>
  <div class="grid g3">${[["week","Weekstaat veiligheidsregio","Capaciteit en bezetting per locatie","Excel","chart"],["raad","Raadsinformatie","Instroom, uitstroom en verblijfsduur per maand","PDF","file"],["woo","Open data (Woo)","Geaggregeerd, groepen <5 onderdrukt","CSV","shield"]].map(([k,a,b,c,i])=>`<button type="button" class="tile" data-layer="modal:export:${k}"><span class="lead" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--tHead);margin-bottom:12px">${ic(i)}</span><h3>${a}</h3><p class="small muted" style="margin:4px 0 10px">${b}</p><span class="tag">${c}</span>${ic("arrow","go s")}</button>`).join("")}</div>`;
};

/* ---------- Gebruikers ---------- */
const ROLEOPTS=[{v:"beveiliging",t:"Beveiliging",d:"Poort, nachtcontrole",icon:"scan"},{v:"intake",t:"Intake",d:"Inschrijven en plaatsen",icon:"plus"},{v:"locatie",t:"Locatiemanager",d:"Alles binnen de locatie",icon:"building"}];
V.gebruikers = () => {
  const perms=[["Naam en kamer van bewoners",1,1,1,0],["In- en uitloop",1,0,1,0],["Plaatsingskenmerken",0,1,1,0],["Begeleidingsnotities",0,0,1,0],["Zorgbehoefte (alleen categorie)",0,1,1,"esc"],["Aantallen per locatie",0,1,1,1],["Exporteren",0,0,1,1],["Gebruikers beheren",0,0,1,0]];
  return head(`<span>Beheer</span>`,"Gebruikers & rollen","Wie ziet wat. Dit is de standaardinrichting. Per locatie kun je hem strenger maken, niet ruimer.",`<button class="btn pri" data-layer="modal:invite">${ic("plus")}Gebruiker uitnodigen</button>`)+
  `<div class="card flush"><div class="ch"><h2>Gebruikers Havenpark</h2><span class="small muted">${USERS.length} accounts</span></div><div class="tw"><table><thead><tr><th>Naam</th><th style="min-width:220px">Rol</th><th class="hide-s">Inloggen</th><th class="hide-m">Laatst actief</th><th></th></tr></thead><tbody>
  ${USERS.map((u,i)=>`<tr><td><div class="person"><span class="av">${ini(u.n)}</span><div><b>${u.n}</b><span class="xs muted">${u.mail}</span></div></div></td><td>${u.n===ROLES.locatie.name?`<span class="tag">${ic("building","s")}Locatiemanager (jij)</span>`:Sel(`users.${i}.role`,ROLEOPTS,{sm:1,label:`Rol van ${u.n}`,onChange:(v,o)=>{audit("Gewijzigd",`Rol ${u.n}: ${o} → ${v}`);toast(`${u.n} is nu ${ROLEOPTS.find(r=>r.v===v).t.toLowerCase()}`,()=>{u.role=o;});}})}</td>
  <td class="small hide-s">${u.invited?`<span class="pill p-warn">Uitnodiging verstuurd ${u.invited}</span>`:u.login}</td><td class="small muted hide-m">${u.last}</td>
  <td class="r">${u.invited?`<div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sm" data-act="reinvite" data-i="${i}">Opnieuw sturen</button><button class="btn sm ghost" data-act="revoke" data-i="${i}">Intrekken</button></div>`:u.n===ROLES.locatie.name?"":`<button class="btn sm ghost" data-act="block" data-i="${i}">${u.blocked?"Deblokkeren":"Blokkeren"}</button>`}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card flush"><div class="ch"><div><h2>Wie ziet wat</h2><p class="small muted">Standaardrechten per rol</p></div></div><div class="tw"><table><thead><tr><th>Gegeven</th><th>Beveiliging</th><th>Intake</th><th>Locatiemanager</th><th>Gemeente</th></tr></thead><tbody>
  ${perms.map(([a,...r])=>`<tr><td><b>${a}</b></td>${r.map(v=>`<td>${v==="esc"?`<span class="pill p-warn nodot">Bij escalatie</span>`:v?`<span class="pill p-ok nodot">${ic("check","s")}Ja</span>`:`<span class="muted2">Nee</span>`}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div></div>`;
};

/* ---------- Audit ---------- */
V.audit = () => {
  const A=S.audit; const q=A.q.toLowerCase();
  const rows=AUDIT.filter(a=>(A.f==="all"||a.what===A.f)&&(!q||(a.who+a.obj).toLowerCase().includes(q)));
  return head(`<span>Beheer</span>`,"Auditlog","Elke keer dat iemand een dossier opent, wijzigt of exporteert. Niet aan te passen, 7 jaar bewaard.",`<button class="btn" data-layer="modal:export:audit">${ic("download")}Exporteren voor FG</button>`)+
  `<div class="card flush"><div class="toolbar">${Seg("audit.f",[["all","Alles",AUDIT.length],["Bekeken","Bekeken"],["Gewijzigd","Gewijzigd"],["Export","Export"],["Scan","Scans"]],{tabs:1,label:"Soort"})}<div class="inpwrap sm" style="width:min(260px,100%)">${ic("search","s")}<input id="aq" data-bind-live="audit.q" type="search" placeholder="Gebruiker of bewonernummer" value="${esc(A.q)}" aria-label="Auditlog doorzoeken"></div></div>
  <div class="tw"><table><thead><tr><th>Tijd</th><th>Wie</th><th>Wat</th><th>Waarover</th><th class="hide-s">Vanaf</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(a=>`<tr class="click" data-aud="${AUDIT.indexOf(a)}"><td class="num">${a.t}</td><td>${a.who}</td><td><span class="tag">${a.what}</span></td><td class="small">${a.obj}</td><td class="hide-s small muted">${a.from}</td><td class="go">${ic("chevr","s")}</td></tr>`).join(""):`<tr><td colspan="6" style="padding:20px">${empty("log","Geen regels gevonden","Pas het filter of de zoekopdracht aan.",`<button class="btn sm" data-act="audClear">Filters wissen</button>`)}</td></tr>`}
  </tbody></table></div><div class="tfoot"><span>${rows.length} regels</span><span>Acties die je in dit prototype doet, komen hier ook bij</span></div></div>`;
};

/* ---------- Statussen ---------- */
V.statussen = () => head(`<span>Prototype</span>`,"Schermstatussen","Laden, leeg, fout, offline, geen toegang en sessie verlopen. Elke status zegt wat er aan de hand is en wat je nu kunt doen.")+
  `<div class="grid g3">
    <div class="card stack"><span class="eyebrow">Laden</span>${[70,92,55,80].map(w=>`<div style="height:12px;border-radius:6px;background:var(--track);width:${w}%"></div>`).join("")}<span class="small muted">Skeleton in de vorm van de echte inhoud. Na 10 seconden: “Dit duurt langer dan normaal”.</span></div>
    <div class="card stack"><span class="eyebrow">Leeg</span>${empty("users","Nog geen bewoners","Importeer je Excel-lijst of schrijf de eerste bewoner in.",`<div class="row" style="justify-content:center"><button class="btn sm pri" data-go="import">Excel importeren</button><button class="btn sm" data-go="intake">Inschrijven</button></div>`)}</div>
    <div class="card stack"><span class="eyebrow">Fout bij opslaan</span><div class="note err">${ic("alert")}<div><b>Opslaan lukte niet</b><span class="small">De verbinding viel weg om 14:02. Je wijziging staat klaar en gaat automatisch mee.</span><button class="link small" data-act="retry" style="margin-top:4px">Nu opnieuw proberen</button></div></div></div>
    <div class="card stack"><span class="eyebrow">Offline</span><div class="note warn">${ic("wifioff")}<div><b>Geen verbinding sinds 14:02</b><span class="small">2 scans wachten. Je kunt gewoon doorwerken.</span><button class="link small" data-go="scanner" style="margin-top:4px">Bekijk in de scanner</button></div></div></div>

  invite:()=>{ const e=F().err; return {title:"Gebruiker uitnodigen",sub:"Voor Havenpark",body:`<div class="field"><label for="in1">Naam <span class="req">*</span></label><input id="in1" class="inp ${e.n?"bad":""}" data-bind="f.n" value="${esc(F().n)}">${e.n?`<span class="err">Vul een naam in</span>`:""}</div><div class="field"><label for="in2">E-mailadres <span class="req">*</span></label><input id="in2" type="email" class="inp ${e.mail?"bad":""}" data-bind="f.mail" value="${esc(F().mail)}" placeholder="naam@organisatie.nl">${e.mail?`<span class="err">Vul een geldig e-mailadres in</span>`:""}</div><div class="field"><span class="lbl">Rol</span>${Sel("f.role",ROLEOPTS)}</div><div class="note">${ic("mail")}<span class="small">De uitnodiging is 7 dagen geldig. Inloggen gaat met het organisatieaccount en tweestapsverificatie.</span></div>`,foot:btnClose()+`<button class="btn pri" data-act="doInvite">${ic("send")}Uitnodiging versturen</button>`}; },

/* =========================================================
   ACTIONS
   ========================================================= */
const me = () => ROLES[S.role].name;
const ACT = {
  palette:()=>openPalette(),
  hoRead:()=>{ S.ov.readHandover=true; toast("Overdracht gelezen"); },
  hoAdd:()=>{ S.ov.addNote=true; setTimeout(()=>$("#hoNote")?.focus()); },
  hoCancel:()=>{ S.ov.addNote=false; S.ov.draft=""; },
  hoSave:()=>{ if(!(S.ov.draft||"").trim()){ toast("Schrijf eerst een aanvulling"); return; } S.ov.handover.push({t:now(),who:me(),txt:S.ov.draft.trim()}); S.ov.draft=""; S.ov.addNote=false; toast("Aanvulling toegevoegd voor dienst C"); },
  resClear:()=>{ S.res.q=""; },
  leaveEnd:()=>{ const r=R(S.selRes); const old={st:r.st,leave:r.leave}; r.st="aanwezig"; delete r.leave; audit("Gewijzigd",`${r.id} · verlof beëindigd`); toast(`Verlof van ${r.n} beëindigd`,()=>Object.assign(r,old)); },
  noteSave:()=>{ const r=R(S.selRes); if(!S.dos.noteDraft.trim()){ toast("Schrijf eerst een notitie"); return; } r.notes.unshift({t:now(),who:me(),txt:S.dos.noteDraft.trim(),vis:S.dos.vis}); S.dos.noteDraft=""; audit("Gewijzigd",`${r.id} · notitie`); toast("Notitie opgeslagen"); },
  intakeNext:()=>{ const I=S.intake;
    if(I.step===1){ I.errors={first:!I.first.trim(),last:!I.last.trim()}; if(I.errors.first||I.errors.last) return; }
    if(I.step===2 && I.bed && !matchRooms().find(x=>x.r.k===I.bed&&x.fits)) I.bed=null;
    if(I.step<4){ I.step++; window.scrollTo(0,0); return; }
    const m=matchRooms().find(x=>x.r.k===I.bed); const beds=m.free.slice(0,I.hh);
    let r=RES.find(x=>x.n.toLowerCase()===`${I.first} ${I.last}`.trim().toLowerCase()&&x.st==="nieuw");
    if(!r){ r={id:"HP-0"+(464+RES.length-12),n:`${I.first.trim()} ${I.last.trim()}`,hh:I.hh,since:I.arrive,lang:LANGS.find(l=>l[0]===I.lang)[1],last:"—"}; RES.push(r); }
    Object.assign(r,{hh:I.hh,beds,st:"aanwezig",last:"ingeschreven "+now()}); I.done=r.id; audit("Gewijzigd",`${r.id} · ingeschreven in ${I.bed}`);
  },
  intakeNew:()=>{ Object.assign(S.intake,{step:1,first:"",last:"",hh:1,feats:new Set(),note:"",bed:null,done:false,idok:false,errors:{}}); },
  doMove:()=>{ const r=R(S.layer.arg); const k=S.f.room; const x=freeRooms(r.hh,r.id).find(y=>y.r.k===k); const old={beds:r.beds,st:r.st}; r.beds=x.free.slice(0,r.hh); if(r.st==="nieuw") r.st="aanwezig"; audit("Gewijzigd",`${r.id} · naar ${k}`); S.layer=null; toast(old.st==="nieuw"?`${r.n} geplaatst in ${k}`:`${r.n} verplaatst naar ${k}`,()=>Object.assign(r,old)); },
  doLeave:()=>{ const r=R(S.layer.arg); const why={fam:"Familiebezoek",werk:"Werk",zkh:"Ziekenhuis",anders:"Anders"}[S.f.why]; const old={st:r.st,leave:r.leave}; r.st="verlof"; r.leave={why,until:`${fdateLong(S.f.to)}, ${S.f.toT}`}; audit("Gewijzigd",`${r.id} · verlof`); S.layer=null; toast(`Verlof voor ${r.n} tot ${r.leave.until}`,()=>Object.assign(r,old)); },
  doCheckout:()=>{ const r=R(S.layer.arg); r.st="vertrokken"; r.beds=[]; audit("Gewijzigd",`${r.id} · uitgeschreven`); S.layer=null; go("bewoners"); toast(`${r.n} uitgeschreven, bedden vrijgegeven`); },
  doBadge:()=>{ const r=R(S.layer.arg); r.badgeLost=false; audit("Gewijzigd",`${r.id} · nieuwe badge`); S.layer=null; toast(`Badge voor ${r.n} ligt bij de printer${S.f.block?"; oude badge geblokkeerd":""}`); },
  placeBed:el=>{ const r=R(S.f.place); const k=el.dataset.k; const x=freeRooms(r.hh).find(y=>y.r.k===k); r.beds=x.free.slice(0,r.hh); r.st="aanwezig"; audit("Gewijzigd",`${r.id} · geplaatst in ${k}`); S.layer=null; toast(`${r.n} geplaatst in ${k}`,()=>{r.beds=[];r.st="nieuw";}); },
  roomOut:el=>{ const room=ROOMS.find(r=>r.k===el.dataset.k); room.out={tech:"Technisch defect",clean:"Schoonmaak of ongedierte",iso:"Isolatie"}[S.f.outWhy]; S.layer=null; toast(`Kamer ${room.k} buiten gebruik`,()=>{delete room.out;}); },
  roomIn:el=>{ const room=ROOMS.find(r=>r.k===el.dataset.k); const o=room.out; delete room.out; S.layer=null; toast(`Kamer ${room.k} weer in gebruik`,()=>{room.out=o;}); },
  doRoom:()=>{ const f=S.f; if(!f.k.trim()||ROOMS.some(r=>r.k===f.k.trim())){ toast(f.k.trim()?`Kamer ${f.k} bestaat al`:"Vul een kamernummer in"); return; } ROOMS.push({k:f.k.trim(),wing:f.wing,type:f.beds>2?"Gezinskamer":"Tweepersoonskamer",beds:f.beds,floor:+f.floor,feats:[...f.feats]}); S.layer=null; S.kam.wing=f.wing; toast(`Kamer ${f.k} toegevoegd met ${f.beds} bedden`); },
  doTicket:()=>{ const f=S.f; if(!f.t.trim()){ f.err=true; return; } const id="M-"+(1043+MELD.filter(m=>+m.id.slice(2)>1042).length); MELD.unshift({id,t:f.t.trim(),cat:f.cat,prio:f.prio,res:f.res||undefined,where:f.where||"Havenpark",when:"vandaag "+now(),by:me(),to:"",status:"open",tl:[{k:"",t:"Gemeld",w:`${now()} · ${me()}`}]}); S.layer=null; S.meld.tab="open"; S.meld.sel=id; S.meld.cat="all"; S.meld.q=""; toast(`Melding ${id} aangemaakt`); },
  meldNote:()=>{ const m=MELD.find(x=>x.id===S.meld.sel); m.tl.push({k:"ink",t:S.meld.draft.trim(),w:`${now()} · ${me()}`}); S.meld.draft=""; toast("Actie opgeslagen"); },
  meldTake:()=>{ const m=MELD.find(x=>x.id===S.meld.sel); m.status="bezig"; if(!m.to) m.to=me(); m.tl.push({k:"ink",t:`Opgepakt door ${me()}`,w:now()}); S.meld.tab="bezig"; toast(`${m.id} staat nu onder ‘In behandeling’`,()=>{m.status="open";m.tl.pop();S.meld.tab="open";}); },
  meldReopen:()=>{ const m=MELD.find(x=>x.id===S.meld.sel); m.status="open"; m.tl.push({k:"warn",t:"Heropend",w:`${now()} · ${me()}`}); S.meld.tab="open"; toast(`${m.id} heropend`); },
  meldClear:()=>{ S.meld.cat="all"; S.meld.q=""; },
  doResolve:el=>{ const f=S.f; if(!f.txt.trim()){ f.err=true; return; } const m=MELD.find(x=>x.id===el.dataset.id); const old=m.status; m.status="klaar"; m.tl.push({k:"ok",t:`Afgehandeld: ${f.txt.trim()}`,w:`${now()} · ${me()}`}); S.layer=null; S.meld.tab="klaar"; S.meld.sel=m.id; toast(`${m.id} afgehandeld${f.notify?`; ${m.by} krijgt bericht`:""}`,()=>{m.status=old;m.tl.pop();S.meld.tab=old;}); },
  doEscalate:el=>{ const f=S.f; const arg=el.dataset.id; const m=MELD.find(x=>x.id===arg); const hh=m?.res?R(m.res).hh:S.intake.hh;
    const id="E-2026-0"+(85+ESC.filter(e=>+e.id.slice(-3)>84).length); const need={mob:"Plek zonder trappen",gezin:"Gezinsplek",cap:"Capaciteit",veil:"Veiligheid",anders:"Anders"}[f.need];
    ESC.unshift({id,t:f.need==="veil"?"Bewoner niet terug, tweede nacht":need+" nodig",loc:"Havenpark",prio:f.due==="today"?"hoog":"normaal",need,hh:hh>1?`Huishouden van ${hh}`:"1 persoon",due:{today:"vandaag 18:00","24h":"morgen "+now(),week:"vrijdag"}[f.due],when:"zojuist",status:"open",options:[["V-02","Vechtoever V-02","Begane grond · 6 bedden"],["EXP","Expohal 3","26 bedden vrij"]],tl:[{k:"",t:"Aangemaakt door locatie"+(f.txt?`: ${f.txt}`:""),w:`${now()} · ${me()}`}]});
    if(m) m.tl.push({k:"warn",t:`Geëscaleerd naar gemeente (${id})`,w:`${now()} · ${me()}`});
    S.layer=null; toast(`Escalatie ${id} verstuurd. Bekijk als ‘Gemeente’ om het te zien.`); },
  doManual:()=>{ const f=S.f; if(!f.res||!f.why){ f.err=true; return; } const r=R(f.res); GATE.unshift({t:now(),id:f.res,ev:f.dir,how:"Handmatig",why:f.why,g:f.gate,by:me(),queued:S.offline}); if(f.dir==="in"&&r.st==="afwezig") r.st="aanwezig"; r.last=`${now()} ${f.dir==="in"?"binnen":"buiten"} (handmatig)`; audit("Handmatig",`${f.res} · ${f.why}`); S.layer=null; toast(`${r.n} handmatig ${f.dir==="in"?"binnen":"buiten"} geregistreerd`,()=>{GATE.shift();}); },
  doAsk:el=>{ if(!S.f.txt.trim()){ toast("Schrijf eerst je vraag"); return; } const e=ESC.find(x=>x.id===el.dataset.id); e.tl.unshift({k:"ink",t:`Vraag aan locatie: ${S.f.txt.trim()}`,w:`${now()} · ${me()}`}); S.layer=null; toast(`Vraag verstuurd naar ${e.loc}`); },
  escDecide:()=>{ const e=ESC.find(x=>x.id===S.esc.sel); const o=e.options.find(x=>x[0]===S.esc.choice[e.id]); e.status="besloten"; e.decision=`Toegewezen: ${o[1]} (${o[2]})`; e.tl.unshift({k:"ok",t:`Besloten: ${o[1]}`,w:`${now()} · ${me()}`}); audit("Gewijzigd",`${e.id} · besloten`); toast(`${o[1]} toegewezen. ${e.loc} krijgt bericht.`,()=>{e.status="open";e.tl.shift();delete e.decision;}); },
  doExport:el=>{ const k=el.dataset.k; audit("Export",{week:"Weekstaat",raad:"Raadsinformatie",woo:"Open data",audit:"Auditlog"}[k]+" ("+S.f.fmt.toUpperCase()+")"); S.layer=null; toast(`Export klaar (${S.f.fmt.toUpperCase()}). In de echte app start nu de download.`); },
  doFile:el=>{ audit("Export",`${el.dataset.what} (${S.f.fmt.toUpperCase()})`); S.layer=null; toast(`${el.dataset.what} klaar (${S.f.fmt.toUpperCase()}). In de echte app start nu de download.`); },
  doInvite:()=>{ const f=S.f; f.err={n:!f.n.trim(),mail:!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(f.mail)}; if(f.err.n||f.err.mail) return; USERS.push({n:f.n.trim(),mail:f.mail.trim(),role:f.role,login:"—",last:"—",invited:"01-10"}); audit("Gewijzigd",`Uitnodiging ${f.mail}`); S.layer=null; toast(`Uitnodiging verstuurd naar ${f.mail}`); },
  reinvite:el=>{ const u=USERS[+el.dataset.i]; u.invited="01-10"; toast(`Nieuwe uitnodiging verstuurd naar ${u.mail}`); },
  revoke:el=>{ const i=+el.dataset.i; const u=USERS.splice(i,1)[0]; toast(`Uitnodiging voor ${u.n} ingetrokken`,()=>USERS.splice(i,0,u)); },
  block:el=>{ const u=USERS[+el.dataset.i]; u.blocked=!u.blocked; u.last=u.blocked?"geblokkeerd":"—"; toast(u.blocked?`${u.n} kan niet meer inloggen`:`${u.n} kan weer inloggen`,()=>{u.blocked=!u.blocked;}); },
  doInzage:el=>{ audit("Export",`${el.dataset.id} · inzagepakket naar FG`); S.layer=null; toast("Pakket klaargezet voor de FG. Termijn: binnen 1 maand reageren."); },
  impSample:()=>{ S.imp.step=2; S.imp.file="Havenpark_bewoners_sept.xlsx"; },
  impRun:()=>{ S.imp.step=4; S.imp.at=now(); audit("Gewijzigd","Import 139 bewoners"); },
  impReset:()=>{ Object.assign(S.imp,{step:1,fixed:{},rolledBack:false}); },
  doRollback:()=>{ S.imp.rolledBack=true; S.layer=null; audit("Gewijzigd","Import teruggedraaid"); toast("Import teruggedraaid"); },
  doNightClose:()=>{ const list=RES.filter(r=>r.beds.length&&r.st!=="verlof"&&r.st!=="vertrokken"); list.forEach(r=>{ if(!S.night.marks[r.id]) S.night.marks[r.id]="no"; });
    list.filter(r=>S.night.marks[r.id]==="no").forEach(r=>{ const ex=MELD.find(m=>m.res===r.id&&m.status!=="klaar"&&m.t.includes("nachtcontrole")); if(ex) ex.tl.push({k:"err",t:"Ook vannacht niet aanwezig",w:`${now()} · ${me()}`}); else MELD.unshift({id:"M-"+(1043+MELD.filter(m=>+m.id.slice(2)>1042).length),t:"Bewoner niet aanwezig bij nachtcontrole",cat:"bewoner",prio:"hoog",res:r.id,where:r.beds[0].slice(0,5),when:"vandaag "+now(),by:me(),to:"",status:"open",tl:[{k:"err",t:"Niet aanwezig bij 23:00-ronde",w:`${now()} · ${me()}`}]}); });
    S.night.closed=now(); S.layer=null; toast("Ronde afgesloten"); },
  nightReopen:()=>{ S.night.closed=null; },
  offline:()=>{ S.offline=!S.offline; if(S.offline){ toast("Toestel offline: scans worden bewaard"); } else { const n=S.queue; S.queue=0; GATE.forEach(g=>delete g.queued); toast(n?`Weer online: ${n} scan${n>1?"s":""} verstuurd`:"Weer online"); } },
  copy:el=>{ const t=el.dataset.txt; (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast(`${t} gekopieerd`)).catch(()=>toast(`Nummer: ${t}`)); },
  audClear:()=>{ S.audit.f="all"; S.audit.q=""; },
  retry:()=>toast("Opnieuw verstuurd, gelukt"),
  loginSso:()=>{ toast(`Ingelogd als ${me()}`); go(ROLES[S.role].home); },
  loginLink:()=>{ const v=S.login.mail.trim(); S.login.err=!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v); if(!S.login.err) S.login.sent=true; },
  loginBack:()=>{ S.login.sent=false; }
};

/* =========================================================
   RENDER + ROUTER
   ========================================================= */
const allowed = id => { if(id==="dossier") return ["intake","locatie"].includes(S.role); for(const g of NAV) for(const it of g.items) if(it.id===id) return it.r.includes("*")||it.r.includes(S.role); return false; };
function renderShell(){
  const Rr=ROLES[S.role];
  $("#whoName").textContent=Rr.name; $("#whoRole").textContent=Rr.role; $("#whoAv").textContent=Rr.av; $("#brandSub").textContent=Rr.sub;
  $("#roles").innerHTML=Object.entries(ROLES).map(([k,r])=>`<button type="button" role="radio" aria-checked="${S.role===k}" data-role="${k}" data-fid="role:${k}">${r.label}</button>`).join("");
  $("#ctx").innerHTML=`<button type="button" class="locbtn" id="ctxBtn" aria-haspopup="listbox" aria-expanded="false"><span class="l">${S.role==="gemeente"?"Regio":"Locatie"}</span><span class="v">${S.role==="gemeente"?"Gemeente Rivierstad":"Havenpark · CNO-01"}</span>${ic("updown","s")}</button>`;
  $("#nav").innerHTML=NAV.map(g=>{const its=g.items.filter(i=>i.r.includes("*")||i.r.includes(S.role)); if(!its.length) return "";
    return `<div class="navgrp"><span class="h">${g.h}</span>${its.map(i=>{const c=i.c?i.c():0;return `<a class="nav" href="#${i.id}" data-go="${i.id}" data-fid="nav:${i.id}" ${S.view===i.id||(S.view==="dossier"&&i.id==="bewoners")?'aria-current="page"':""}>${ic(i.i)}<span>${i.t}</span>${c?`<span class="cnt">${c}</span>`:""}</a>`}).join("")}</div>`}).join("");
  $("#bellDot").hidden=S.notifRead; $("#syncPill").className="syncpill hide-s"+(S.offline?" off":""); $("#syncPill").innerHTML=`<i></i>${S.offline?`Offline${S.queue?` · ${S.queue} wacht`:""}`:"Gesynchroniseerd"}`;
}
function render(){
  const a=document.activeElement; const fid=a?.dataset?.fid, aid=a?.id; const sel=a&&"selectionStart" in a?[a.selectionStart,a.selectionEnd]:null;
  if(!allowed(S.view)) S.view=ROLES[S.role].home;
  renderShell();
  $("#view").innerHTML=V[S.view]();
  renderLayer();
  const t=(fid&&$(`[data-fid="${CSS.escape(fid)}"]`))||(aid&&document.getElementById(aid));
  if(t && t!==document.body){ t.focus({preventScroll:true}); if(sel&&"setSelectionRange" in t){ try{t.setSelectionRange(...sel)}catch(_){} } }
  else if(S.layer){ $("#layer .drawer, #layer .modal")?.querySelector("input,textarea,button.sel,[data-closelayer].iconbtn")?.focus({preventScroll:true}); }
}
function go(v){ closePop(false); S.layer=null; S.view=v; try{history.replaceState(null,"","#"+v)}catch(e){} $("#side").classList.remove("open"); render(); window.scrollTo(0,0); $("#view").focus({preventScroll:true}); }

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("pointerdown",e=>{ if(POP && !POP.el.contains(e.target) && !POP.anchor?.contains(e.target) && !e.target.closest(".palette")) closePop(false); },true);
document.addEventListener("click",e=>{
  const T=s=>e.target.closest(s);
  let el;
  if(T("[data-closelayer]")){ closeLayer(); return; }
  if(el=T("[data-sel]")){ if(POP?.anchor===el){ closePop(); return; } openSelect(el); return; }
  if(el=T("[data-date]")){ if(POP?.anchor===el){ closePop(); return; } openDate(el); return; }
  if(el=T("[data-menu]")){ e.stopPropagation(); if(POP?.anchor===el){ closePop(); return; } openMenu(el,el.dataset.menu,el.dataset.arg); return; }
  if(el=T("#cmdk")){ openPalette(); return; }
  if(el=T("#bellBtn")){ if(POP?.anchor===el){ closePop(); return; } openNotifs(el); return; }
  if(el=T("#userBtn")){ if(POP?.anchor===el){ closePop(); return; } openMenu(el,"user"); return; }
  if(el=T("#ctxBtn")){ if(POP?.anchor===el){ closePop(); return; } openLocs(el); return; }
  if(el=T("#burger")){ $("#side").classList.toggle("open"); return; }
  if(T("#poplayer")) return;
  if((el=T("[aria-disabled='true']"))&&el.matches(".ccard")) return;
  if(el=T("[data-set]")){ const p=el.dataset.set, cur=get(p); set(p, typeof cur==="number"?+el.dataset.val:el.dataset.val);
    if(p==="intake.wing") S.intake.bed=null; if(p.startsWith("meldsel.")&&p.endsWith(".prio")){ const m=MELD.find(x=>x.id===p.split(".")[1]); m.tl.push({k:"ink",t:`Prioriteit: ${PRIO[m.prio][1].toLowerCase()}`,w:`${now()} · ${me()}`}); }
    if(p==="meld.tab"){ S.meld.draft=""; } render(); return; }
  if(el=T("[data-toggle]")){ const s=get(el.dataset.toggle); const v=el.dataset.val; s.has(v)?s.delete(v):s.add(v); if(el.dataset.toggle==="intake.feats") S.intake.bed=null; render(); return; }
  if(el=T("[data-flip]")){ set(el.dataset.flip,!get(el.dataset.flip)); render(); return; }
  if(el=T("[data-inc]")){ const p=el.dataset.inc; set(p,Math.max(+el.dataset.min,Math.min(+el.dataset.max,get(p)+ +el.dataset.d))); if(p==="intake.hh"){ S.intake.bed=null; if(S.intake.hh>1) S.intake.wing="A"; } render(); return; }
  if(el=T("[data-role]")){ S.role=el.dataset.role; S.layer=null; closePop(false); if(!el.dataset.go){ if(!allowed(S.view)) S.view=ROLES[S.role].home; render(); return; } }
  if(el=T("[data-go]")){ e.preventDefault(); go(el.dataset.go); return; }
  if(el=T("[data-open-res]")){ openRes(el.dataset.openRes); return; }
  if(el=T("[data-goto]")){ const [k,v]=el.dataset.goto.split(":");
    if(k==="meld"){ const m=MELD.find(x=>x.id===v); S.meld={...S.meld,tab:m.status,sel:v,cat:"all",q:""}; go("meldingen"); }
    if(k==="res"){ S.res.tab=v; go("bewoners"); }
    if(k==="bed"){ go("kamers"); S.kam.sel=v; S.f=FORM_INIT.bed(); openLayer("drawer","bed",v); }
    if(k==="audit"){ S.audit.q=v; S.audit.f="all"; go("audit"); }
    if(k==="esc"){ S.esc.tab="open"; S.esc.sel=v; go("escalaties"); }
    return; }
  if(el=T("[data-layer]")){ const [type,name,arg]=el.dataset.layer.split(":"); S.f=FORM_INIT[name]?FORM_INIT[name](arg):{}; if(name==="badge") S.f.lang=({"Arabisch":"ar","Oekraïens":"uk","Somalisch":"so"})[R(arg).lang.split(",")[0]]||"en"; openLayer(type,name,arg); return; }
  if(el=T("[data-act]")){ const fn=ACT[el.dataset.act]; if(fn){ fn(el); render(); } return; }
  if(el=T("[data-sort]")){ const k=el.dataset.sort; S.res.dir = S.res.sort===k ? -S.res.dir : 1; S.res.sort=k; render(); return; }
  if(el=T("[data-msel]")){ S.meld.sel=el.dataset.msel; S.meld.draft=""; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }
  if(el=T("[data-esel]")){ S.esc.sel=el.dataset.esel; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }
  if(el=T("[data-bed]")){ S.kam.sel=el.dataset.bed; S.f=FORM_INIT.bed(); openLayer("drawer","bed",el.dataset.bed); return; }
  if(el=T("[data-loc]")){ S.f={}; openLayer("drawer","loc",el.dataset.loc); return; }
  if(el=T("[data-gate]")){ openLayer("drawer","gate",+el.dataset.gate); return; }
  if(el=T("[data-aud]")){ openLayer("drawer","auditrow",+el.dataset.aud); return; }
  if(el=T("[data-mark]")){ const id=el.dataset.mark; S.night.marks[id]= S.night.marks[id]===el.dataset.v ? undefined : el.dataset.v; render(); return; }
  if(el=T("[data-istep]")){ S.intake.step=+el.dataset.istep; render(); window.scrollTo(0,0); return; }
  if(el=T("[data-impstep]")){ S.imp.step=+el.dataset.impstep; render(); return; }
  if(el=T("[data-scantab]")){ S.scan.tab=el.dataset.scantab; S.scan.pick=null; render(); return; }
  if(el=T("[data-pick]")){ S.scan.pick=el.dataset.pick; S.scan.tab="scan"; render(); return; }
  if(el=T("[data-scan]")){ const who=S.scan.pick?R(S.scan.pick):S.scan.state==="flag"?R("HP-0433"):R("HP-0440"); const ev=el.dataset.scan; const old={st:who.st,last:who.last};
    GATE.unshift({t:now(),id:who.id,ev,how:S.scan.pick?"Handmatig":"QR-badge",why:S.scan.pick?"Gezocht op naam":undefined,g:"Poort 1",by:S.scan.pick?me():"Systeem",queued:S.offline}); if(S.offline) S.queue++;
    if(ev==="in"&&(who.st==="afwezig"||who.st==="verlof")) who.st="aanwezig"; who.last=`${now()} ${ev==="in"?"binnen":"buiten"}`;
    if(old.st==="afwezig"&&ev==="in"){ const m=MELD.find(x=>x.res===who.id&&x.status!=="klaar"); m?.tl.push({k:"ok",t:"Weer binnen via Poort 1",w:`${now()} · ${me()}`}); }
    S.scan.pick=null; render(); toast(`${who.n}: ${ev==="in"?"naar binnen":"naar buiten"}${S.offline?" (bewaard, gaat mee bij verbinding)":""}`,()=>{GATE.shift(); if(S.offline)S.queue--; Object.assign(who,old);}); return; }
  if(el=T("[data-dday]")){ S.dos.day=el.dataset.dday; render(); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){ set(t.dataset.bind,t.value); if(t.classList.contains("bad")){ t.classList.remove("bad"); } return; }
  if(t.dataset.bindLive){ set(t.dataset.bindLive,t.value); render(); }
});
document.addEventListener("change",e=>{ if(e.target.id==="file"&&e.target.files[0]){ S.imp.file=e.target.files[0].name; S.imp.step=2; render(); toast(`${S.imp.file} geladen (voorbeelddata)`); } });
document.addEventListener("dragover",e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave",e=>{ e.target.closest?.("#drop")?.classList.remove("over"); });
document.addEventListener("drop",e=>{ if(e.target.closest?.("#drop")){ e.preventDefault(); const f=e.dataTransfer.files[0]; S.imp.file=f?.name||"bestand"; S.imp.step=2; render(); toast(`${S.imp.file} geladen (voorbeelddata)`); } });
document.addEventListener("mouseover",e=>{
  const h=e.target.closest?.("[data-hr]"); if(h&&$("#hrRead")){ const [hr,i,o]=HOURS[+h.dataset.hr]; $("#hrRead").innerHTML=`<b style="color:var(--ink)">${hr}:00–${hr}:59</b> · ${i} naar binnen, ${o} naar buiten`; }
  const w=e.target.closest?.("[data-wk]"); if(w&&$("#rapRead")){ const n=S.rap.range; const base=[1290,1302,1296,1310,1305,1318,1312,1320,1316,1324,1319,1330,1326,1318,1325,1331,1322,1340,1349,1338,1344,1352,1357,1350,1362,1362].slice(-n); const i=+w.dataset.wk; $("#rapRead").innerHTML=`<b style="color:var(--ink)">Week ${40-n+1+i}</b> · gemiddeld ${nf(base[i])} bewoners per nacht (${pct(base[i],1480)}% van capaciteit)`; }
});
document.addEventListener("keydown",e=>{
  if(POP?.onKey) POP.onKey(e);
  if(e.key==="Escape"){ if(POP){ e.preventDefault(); if(POP.el.querySelector(".palette")){ POP.el.remove(); POP=null; } else closePop(); return; } if(S.layer){ closeLayer(); return; } $("#side").classList.remove("open"); }
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.key==="/"&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k")){ e.preventDefault(); openPalette(); }
  if(e.key==="Tab"&&S.layer&&!POP){ const box=$("#layer .drawer, #layer .modal"); const f=$$("button:not([disabled]),input,textarea,[tabindex]:not([tabindex='-1'])",box); if(f.length){ if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();} } }
});
addEventListener("resize",()=>closePop(false));
addEventListener("scroll",e=>{ if(POP&&!POP.el.contains(e.target)&&!POP.el.querySelector?.(".palette")) closePop(false); },true);

try{ const th=localStorage.getItem("ss-theme"); if(th) document.documentElement.dataset.theme=th; }catch(_){}
const h0=(location.hash||"").slice(1); if(h0&&V[h0]){ S.view=h0; if(!allowed(h0)){ for(const k in ROLES){ S.role=k; if(allowed(h0)) break; } } }
render();
</script>
